name: aptapp
description: aktivplan+

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 4.4.2+71

environment:
  sdk: ">=3.0.0"

module:
  androidX: true

scripts: null

dependencies:
  another_flushbar: ^1.12.30
  apt_api:
    path: ./api/apt_api
  autocomplete_textfield_ns: ^2.0.0
  beamer: ^1.6.0
  cloud_firestore: ^5.5.0
  dart_date: ^1.3.2
  email_validator: ^2.1.17
  equatable: ^2.0.5
  file_picker: ^9.2.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.2.5
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_breadcrumb: ^1.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_linkify: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_masked_text2: ^0.9.1
  flutter_secure_storage: ^10.0.0
  flutter_story_presenter: ^1.0.7
  flutter_svg: ^2.2.3
  flutter_typeahead: ^5.2.0
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.19.0
  intl_utils: ^2.8.6
  jiffy: ^6.3.2
  kiwi: ^4.1.0
  location_picker_flutter_map: ^4.1.0
  material_design_icons_flutter: ^7.0.7296
  material_symbols_icons: ^4.2719.1
  matomo_tracker: ^6.1.0
  mime: ^1.0.2
  mobile_scanner: ^7.1.3
  multi_dropdown: ^3.0.1
  openapi_generator_annotations: ^6.0.0
  overlay_support: ^2.0.1
  percent_indicator: ^4.2.3
  pretty_qr_code: ^3.5.0
  reorderables: ^0.6.0
  responsive_builder: ^0.7.0
  responsive_grid: ^2.1.0
  screenshot: ^3.0.0
  share_plus: ^10.1.2
  health: ^13.3.1
  permission_handler: ^11.0.0
  shared_preferences: ^2.2.3
  story_view: ^0.16.6
  styled_text: ^8.1.0
  table_calendar: ^3.0.3
  timeline_tile: ^2.0.0
  url_launcher: ^6.2.6
  video_player: ^2.11.1
  week_of_year: ^2.2.0
  youtube_player_iframe: ^5.2.2
  youtube_player_iframe_web: ^3.1.2

dependency_overrides:
  intl: 0.19.0
  collection: 1.19.0

dev_dependencies:
  build_runner: ^2.4.9
  dependency_validator: ^3.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  openapi_generator: ^6.0.0

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app-icon.png"
  image_path_ios: "assets/images/app-icon-ios.png"
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/version/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
