name: aptapp
description: aktivplan+

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 4.6.4+79

environment:
  sdk: ">=3.0.0"

module:
  androidX: true

scripts: null

dependencies:
  another_flushbar: ^2.2.4
  apt_api:
    path: ./api/apt_api
  autocomplete_textfield_ns: ^2.0.0
  beamer: ^1.7.0
  cloud_firestore: ^6.6.0
  dart_date: ^1.5.3
  email_validator: ^3.0.0
  equatable: ^2.0.8
  file_picker: ^11.0.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_breadcrumb: ^1.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_linkify: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_masked_text2: ^0.9.1
  flutter_secure_storage: ^10.2.0
  flutter_story_presenter: ^1.0.7
  flutter_svg: ^2.2.3
  flutter_typeahead: ^5.2.0
  home_widget: ^0.9.2
  http: ^1.6.0
  path_provider: ^2.1.5
  image_picker: ^1.2.2
  intl: ^0.19.0
  intl_utils: ^2.8.6
  jiffy: ^6.4.4
  kiwi: ^5.0.1
  location_picker_flutter_map: ^4.1.0
  material_symbols_icons: ^4.2928.1
  matomo_tracker: ^6.1.0
  mobile_scanner: ^7.2.0
  multi_dropdown: ^3.1.1
  openapi_generator_annotations: ^6.0.0
  overlay_support: ^2.1.0
  percent_indicator: ^4.2.5
  pretty_qr_code: ^3.6.0
  reorderables: ^0.6.0
  responsive_builder: ^0.7.1
  responsive_grid: ^2.4.0
  screenshot: ^3.0.0
  share_plus: ^10.1.2
  shared_preferences: ^2.5.5
  story_view: ^0.16.6
  styled_text: ^8.1.0
  table_calendar: ^3.0.3
  timeline_tile: ^2.0.0
  url_launcher: ^6.2.6
  video_player: ^2.11.1
  week_of_year: ^2.2.0
  youtube_player_iframe: ^5.2.2
  youtube_player_iframe_web: ^3.1.2
  chewie: ^1.13.1
  wakelock_plus: ^1.5.2
  flutter_map_location_marker: ^10.2.0
  flutter_material_design_icons: ^3.1.0+7447
  web: ^1.1.1

dependency_overrides:
  intl: 0.19.0
  collection: 1.19.0

dev_dependencies:
  build_runner: ^2.4.9
  dependency_validator: ^3.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  openapi_generator: ^6.0.0

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app-icon.png"
  image_path_ios: "assets/images/app-icon-ios.png"
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/version/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
