allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    configurations.configureEach {
        resolutionStrategy.force(
            'androidx.glance:glance:1.1.1',
            'androidx.glance:glance-appwidget:1.1.1',
            'androidx.glance:glance-appwidget-external-protobuf:1.1.1',
            'androidx.glance:glance-appwidget-proto:1.1.1'
        )
    }

    plugins.withId('com.android.application') {
        android.buildTypes.configureEach { buildType ->
            if (buildType.name != 'release') {
                buildType.minifyEnabled = false
            }
        }
    }

    plugins.withId('com.android.library') {
        android.buildTypes.configureEach { buildType ->
            if (buildType.name != 'release') {
                buildType.minifyEnabled = false
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Exclude test-provided XML pull implementations that collide with Android framework
configurations.all {
    exclude group: 'net.sf.kxml', module: 'kxml2'
    exclude group: 'org.xmlpull', module: 'xmlpull'
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
